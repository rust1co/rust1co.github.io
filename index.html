<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rust & Co. Store</title>
<meta name="description" content="Rust & Co. scripts, vehicles and assets for RedM and FiveM.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "RDR Lino";
    src: url("RDRLino-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --paper: #e6e6e6;
    --blood: #8b1a1a;
    --ink: #0a0a0a;
    --neon: #f26b1d; /* FiveM orange */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: Inter, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .doors { flex: 1; display: flex; position: relative; min-height: 520px; }
  .door {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 0 6vw 12vh;
    color: inherit;
    text-decoration: none;
    overflow: hidden;
    transition: flex 1.1s cubic-bezier(.25,.1,.25,1);
  }
  .door::after { /* dim layer for the side not hovered */
    content: "";
    position: absolute; inset: 0;
    background: rgba(0,0,0,0);
    transition: background 1.1s ease;
  }
  .doors:hover .door { flex: .94; }
  .doors:hover .door:hover { flex: 1.12; }
  .doors:hover .door:not(:hover)::after { background: rgba(0,0,0,.35); }

  .redm {
    background:
      linear-gradient(to top, rgba(10,10,10,.95) 5%, rgba(10,10,10,0) 60%),
      linear-gradient(120deg, rgba(139,26,26,.55), rgba(196,120,40,.25)),
      url("redm.jpg") 70% center / cover;
  }
  /* same treatment as RedM; drop a darkened GTA print in as fivem.jpg (dark gradient shows until then) */
  .fivem {
    background:
      linear-gradient(to top, rgba(10,10,10,.95) 5%, rgba(10,10,10,0) 60%),
      linear-gradient(rgba(10,10,10,.4), rgba(10,10,10,.4)),
      linear-gradient(240deg, rgba(242,107,29,.25), rgba(120,40,10,.1)),
      url("fivem.jpg") 72% center / cover,
      #1a120c;
  }

  .game-logo {
    height: 64px; width: auto;
    align-self: flex-start;
    margin-bottom: 1.2rem;
    position: relative; z-index: 1;
    filter: drop-shadow(0 4px 16px rgba(0,0,0,.6));
  }

  .tag {
    font: 600 .75rem/1 Inter, sans-serif;
    letter-spacing: .3em;
    text-transform: uppercase;
    opacity: .7;
    margin-bottom: .8rem;
    position: relative; z-index: 1;
  }
  .door h2 {
    font: 700 clamp(2.6rem, 6vw, 5.5rem)/1 Inter, sans-serif;
    letter-spacing: .02em;
    position: relative; z-index: 1;
  }
  .redm h2 { font: 400 clamp(3rem, 7vw, 6.5rem)/1 "RDR Lino", Cinzel, serif; letter-spacing: .03em; }
  .fivem h2 { font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }
  .door p {
    max-width: 30ch;
    margin: 1rem 0 1.6rem;
    opacity: .8;
    position: relative; z-index: 1;
  }
  .cta {
    align-self: flex-start;
    position: relative; z-index: 1;
    padding: .9rem 1.6rem;
    font-weight: 600;
    letter-spacing: .15em;
    text-transform: uppercase;
    font-size: .8rem;
    border: 1px solid currentColor;
    transition: background .8s ease, color .8s ease, border-color .8s ease;
  }
  .redm .cta { color: var(--paper); }
  .redm:hover .cta { background: var(--blood); border-color: var(--blood); }
  .fivem .cta { color: var(--neon); }
  .fivem:hover .cta { background: var(--neon); color: var(--ink); }

  .brand {
    position: absolute;
    top: 6vh; left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    text-align: center;
    pointer-events: none;
  }
  .brand img { width: 120px; height: auto; filter: drop-shadow(0 4px 20px rgba(0,0,0,.8)); }
  .brand span {
    display: block;
    margin-top: .4rem;
    font: 600 .7rem/1 Inter, sans-serif;
    letter-spacing: .4em;
    text-transform: uppercase;
    opacity: .7;
  }
  .divider {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 1px;
    background: linear-gradient(transparent, rgba(230,230,230,.25), transparent);
    z-index: 2;
    pointer-events: none;
    transition: opacity .4s;
  }
  .doors:hover .divider { opacity: 0; }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem 2rem;
    justify-content: space-between;
    align-items: center;
    padding: 1.2rem 6vw;
    border-top: 1px solid rgba(230,230,230,.1);
    font-size: .85rem;
  }
  footer nav { display: flex; gap: 1.6rem; }
  footer a { color: var(--paper); opacity: .7; text-decoration: none; }
  footer a:hover { opacity: 1; }
  footer small { opacity: .4; }

  @media (max-width: 760px) {
    .doors { flex-direction: column; }
    .doors:hover .door, .doors:hover .door:hover { flex: 1; }
    .doors:hover .door:not(:hover)::after { background: none; }
    .door { min-height: 46vh; padding: 0 16px 6vh; }
    .divider { display: none; }
    .brand { position: static; transform: none; padding: 24px 16px 8px; }
    .brand img { width: 72px; }
    .door { min-height: 40vh; padding-top: 24px; }
    footer { padding: 1.2rem 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .door, .door::after { transition: none; }
  }
</style>
</head>
<body>
  <main class="doors">
    <div class="brand">
      <img src="logo.png" alt="Rust & Co.">
      <span>Choose your world</span>
    </div>
    <div class="divider"></div>

    <a class="door redm" href="https://rust-co.tebex.io">
      <svg class="game-logo" viewBox="0 0 34 60" aria-hidden="true"><path fill="#c8302b" d="M20.376 13.719L21.195 10.869L22.047 8.367L22.413 7.311L22.698 6.477L23.247 4.881L23.664 3.663L23.946 2.817L24.921 0H33.27L33.063 0.621L32.838 1.77L32.661 3.072L32.388 4.08L32.187 5.085L31.377 9.225L20.37 13.722L20.376 13.719ZM27.585 38.112L32.616 37.785L31.233 58.056V59.997H0.345L0 44.391L0.129 36.225L0.114 33.516L0.324 30.567L0.507 26.991L0.609 25.371L0.762 22.986L0.741 22.458L0.861 18.399L0.996 15.201V12.099V11.346L1.026 11.01L1.098 10.236L1.158 9.402V2.268L1.239 0.885L1.209 0.165L4.014 0.255L5.862 0.315L10.935 0.48L10.752 7.119L10.731 7.872L10.677 8.97L10.62 10.413L10.581 11.157L10.539 12.123L10.488 13.383V20.031L10.095 25.374L9.822 29.079L9.804 29.316L9.747 30.111L9.735 30.264L9.723 30.411L9.537 32.952L9.186 37.71H15.426L16.278 32.952L16.599 31.161L16.647 30.897L16.839 29.997L16.881 29.796L17.223 28.188L17.307 27.795L18.141 23.856L29.112 19.425L26.655 29.187L26.64 29.262L26.574 29.601L25.869 33.18L24.909 38.052L25.479 38.112H27.582H27.585ZM23.946 51.003L23.784 48.075L23.946 45.726H8.862L9.054 47.604V49.311L8.862 51H23.946V51.003Z"/></svg>
      <div class="tag">Red Dead Redemption 2</div>
      <h2>RedM</h2>
      <p>Native vehicles, scripts and assets for the frontier.</p>
      <span class="cta">Enter store</span>
    </a>

    <a class="door fivem" href="fivem/">
      <svg class="game-logo" viewBox="0 0 51 60" aria-hidden="true"><path fill="#f26b1d" d="M10.959 27.123L19.509 1.473C19.803 0.591 20.625 0 21.552 0H30.99L32.787 5.403L10.959 27.123ZM35.67 14.07L27.624 22.107L38.817 60H50.949L35.67 14.07ZM5.148 44.553L0 60H12.123L21.588 28.137L5.148 44.556V44.553Z"/></svg>
      <div class="tag">Grand Theft Auto V</div>
      <h2>FiveM</h2>
      <p>Scripts and assets for modern roleplay servers.</p>
      <span class="cta">Enter store</span>
    </a>
  </main>

  <footer>
    <nav>
      <a href="https://discord.gg/j67u6pbnDs">Discord</a>
      <a href="#">Docs</a>
    </nav>
    <small>© Rust & Co. Not affiliated with Rockstar Games.</small>
  </footer>
</body>
</html>
